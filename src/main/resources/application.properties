# Common properties
server.port=8081
mybatis.configuration.map-underscore-to-camel-case=true

# Active profile: switch to 'prod' for formal environment
spring.profiles.active=dev

# Increase max upload size
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 腾讯云对象存储 COS (生产环境通过环境变量注入，避免明文泄露)
tencent.cos.enabled=${COS_ENABLED:false}
tencent.cos.secret-id=${COS_SECRET_ID:}
tencent.cos.secret-key=${COS_SECRET_KEY:}
tencent.cos.region=${COS_REGION:ap-guangzhou}
tencent.cos.bucket-name=${COS_BUCKET_NAME:}
tencent.cos.domain=${COS_DOMAIN:}

# 微信订单即时通知配置 (PushPlus 推送加)
# 扫码获取 Token 网址: https://www.pushplus.plus
pushplus.enabled=${PUSHPLUS_ENABLED:true}
pushplus.token=${PUSHPLUS_TOKEN:7dab0b762b9f42ce8e536bf7ed81ebd3}
pushplus.topic=${PUSHPLUS_TOPIC:caibread}
